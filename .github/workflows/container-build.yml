name: container-build
# Proves the image still builds from this revision and holds its two boot invariants (mumate-infra-move-001
# slice 1), then — when asked — pushes it to GHCR by git SHA for the control room (slice 2). Runs
# scripts/container-smoke.sh --no-db — the SAME script a developer runs locally — so CI and a laptop cannot
# disagree about what "the image works" means. The database leg (GET /health → db ok) needs a Postgres with SSL
# and is run locally against the arena before a PR is marked ready; CI says so explicitly rather than printing
# a green it did not earn.
#
# MANUAL ONLY (owner decision 2026-09-19): the launch lane must not see this job on its pull requests and CI
# minutes are paid. Run it from the Actions tab when a container change needs a second machine's proof, or with
# push=true to publish ghcr.io/mojisejr/mootech-be:<sha> (tag = the exact commit; never latest — #637 §8.3).
# GITHUB_TOKEN with packages:write is enough for GHCR on this repository; no PAT, no secret added.
on:
  workflow_dispatch:
    inputs:
      push:
        description: "push ghcr.io/mojisejr/mootech-be:<sha> (owner decision per slice; false = build + smoke only)"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build + hygiene + DB_SYNCHRONIZE refusal (no database in CI)
        run: bash scripts/container-smoke.sh --no-db
      - name: login to GHCR
        if: ${{ inputs.push }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: push by SHA (the smoke-tested image, retagged — not a rebuild)
        if: ${{ inputs.push }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          src="mootech-be:smoke-${sha:0:12}"
          dst="ghcr.io/mojisejr/mootech-be:${sha}"
          docker tag "$src" "$dst"
          docker push "$dst"
          echo "pushed $dst" >> "$GITHUB_STEP_SUMMARY"
