name: main-guard
# TRIPWIRE on direct pushes to main. Ported from mootech-fe by mojisejr/mootech-fe#321, which archived this
# repo's `ci.yml`: the only workflow left here (secret-scan) triggers on `pull_request` only, so a direct push
# to main would run NOTHING — and merge into main = Render production deploy. This runs whenever main MOVES and
# goes red loudly if (A) main fails tsc, or (B) main was moved by a direct push instead of a PR merge.
#
# NOT a required status check — it observes main after the fact; making it required would block unrelated PRs.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  integrity: # job A — main must always pass tsc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: typecheck (tsc --noEmit)
        run: npx tsc --noEmit

  provenance: # job B — HEAD on main must be a GitHub PR-merge commit, not a direct push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2 # need HEAD + its parents to count them
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: assert HEAD is a PR merge-commit (names the pusher if not)
        env:
          GITHUB_ACTOR: ${{ github.actor }}
        run: npx ts-node scripts/assert-main-provenance.ts
